changelog:
  categories:
    - title: New features
      labels: [enhancement, feature]
    - title: Fixes
      labels: [bug, fix]
    - title: Agent coverage
      labels: [agent-residue, provider]
    - title: Documentation and maintenance
      labels: [documentation, dependencies, ci]
    - title: Other changes
      labels: ["*"]
  exclude:
    labels: [skip-changelog]

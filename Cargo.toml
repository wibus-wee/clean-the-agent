[package]
name = "clean-the-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Inspect and clean changes left by developer tools"
license = "MIT"
default-run = "clean-the-agent"

[lib]
name = "clean_any"

[[bin]]
name = "clean-any"
path = "src/bin/clean-any.rs"

[dependencies]
atomic-write-file = "0.3.1"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
inquire = { version = "0.9.4", default-features = false, features = ["crossterm", "fuzzy"] }
jsonc-parser = { version = "0.33", features = ["cst", "serde_json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.20"
toml_edit = "0.25"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

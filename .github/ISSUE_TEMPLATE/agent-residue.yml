name: Agent residue report
description: Report files, hooks, worktrees, integrations, or configuration left by an agent product.
title: "[agent residue]: "
labels: [agent-residue, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping Clean the Agent support another product or artifact. Remove credentials, prompts, history, private repository names, usernames, and other personal data before submitting.
  - type: input
    id: product
    attributes:
      label: Agent product and version
      placeholder: Product name 1.2.3
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - macOS
        - Linux
        - WSL
        - Container or remote environment
        - Other
    validations:
      required: true
  - type: textarea
    id: uninstall
    attributes:
      label: Installation and uninstall method
      description: Explain how the product was installed, how it was removed, and whether its own cleanup command was run.
    validations:
      required: true
  - type: textarea
    id: residue
    attributes:
      label: Residue that remains
      description: List redacted paths, process names, hooks, configuration fragments, services, or worktrees. Use synthetic values where possible.
      render: text
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Ownership evidence
      description: Explain how the product created or owns each item. Include exact markers, manifests, logs, uninstall documentation, or reproducible steps without private data.
    validations:
      required: true
  - type: dropdown
    id: user_data
    attributes:
      label: Could this contain user work or history?
      options:
        - Yes or unsure
        - No, it is reproducible generated state
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: Expected cleanup boundary
      description: What can be removed automatically, what needs review, and what should only be reported?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, credentials, personal data, prompts, history, and private repository details.
          required: true
        - label: I searched existing issues for this product and residue.
          required: true
